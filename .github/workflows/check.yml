name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-check:
    name: Library self-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate conventions, router/README closure, counts; run & compile reference code
        run: python3 scripts/check.py
